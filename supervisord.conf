; ==============================================================
; Supervisor configuration for Laravel on Render (single container)
; Manages: php-fpm, nginx, and the Laravel queue worker
; ==============================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
; Lower loglevel to 'debug' if you need more verbosity during dev
loglevel=info

; ---------------------------------------------------------------
; PHP-FPM — FastCGI process manager
; ---------------------------------------------------------------
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT        ; graceful shutdown signal for php-fpm
stopwaitsecs=30        ; give it 30s to finish existing requests

; ---------------------------------------------------------------
; Nginx — Web server (must start AFTER php-fpm is ready)
; ---------------------------------------------------------------
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
; Higher priority number = starts after php-fpm
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------
; Laravel Queue Worker
; ---------------------------------------------------------------
[program:laravel-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
; Starts last — after nginx and php-fpm are up
priority=30
numprocs=1
; Restart the worker every hour (--max-time=3600) to prevent memory bloat.
; Supervisor will automatically bring it back up.
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0