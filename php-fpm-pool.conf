[www]
user = www-data
group = www-data

clear_env = no

; Keep HOME outside /root so libpq can resolve the default cert path
env[HOME] = /var/www

; On-demand rather than static: a 512MB Render box cannot afford to keep every
; worker resident. This idles at 1-2 workers (leaving headroom for reports and
; exports) and bursts to max_children when several people chat at once.
;
; Capped at 4 because each Laravel worker peaks around 50-70MB here once the page
; context JSON and decoded AI payloads are in memory. 4 x ~65MB + ~200MB for the
; OS/nginx/supervisor lands just inside 512MB; 6 would OOM.
;
; process_idle_timeout only reaps *idle* workers, so a worker holding a chat
; stream is never killed mid-turn.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 15s
pm.max_requests = 500

listen = 127.0.0.1:9000