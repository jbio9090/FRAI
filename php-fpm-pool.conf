[www]
; By default PHP-FPM clears ALL environment variables before running PHP.
; This means env() returns null for everything — including APP_KEY, VAPID keys, etc.
; Setting this to 'no' passes the container's environment through to PHP.
clear_env = no

; Keep memory usage predictable on Render's free tier (512 MB total)
pm = static
pm.max_children = 2