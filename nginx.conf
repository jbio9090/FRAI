server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Increased upload limit for profile pictures and documents
    client_max_body_size 64M;

    # Buffer fixes for large Inertia/Ziggy headers (Prevents 502)
    proxy_buffer_size   128k;
    proxy_buffers       4 256k;
    proxy_busy_buffers_size   256k;

    index index.php;
    charset utf-8;

    # Handle the /storage path directly
    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ =404;
        
        # Performance for uploaded media
        access_log off;
        expires max;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Performance: Cache static frontend assets (Vite/React build)
    location ~* \.(?:css|js|woff2?|svg|gif|map|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI buffer fixes
        fastcgi_buffer_size 32k;
        fastcgi_buffers 4 32k;
        fastcgi_busy_buffers_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}