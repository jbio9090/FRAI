[www]
; Required — PHP-FPM won't start without these
user = www-data
group = www-data

; Pass container environment variables through to PHP
; Without this, env() returns null for everything (APP_NAME, VAPID keys, etc.)
clear_env = no

; Keep memory usage predictable on Render's free tier (512 MB total)
pm = static
pm.max_children = 2

; Listen on TCP so Nginx can reach it
listen = 127.0.0.1:9000